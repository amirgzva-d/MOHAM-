<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohajer Mobin Steel - Landing Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" data-key="page.container">
        <header class="header" data-key="header">
            <div class="logo" data-key="header.logo">
                <img data-key="image.logo" src="https://res.cloudinary.com/dqhbyqftq/image/upload/v1789556584/%D9%84%D9%88%DA%AF%D9%88_1_ets73u.png" alt="Mohajer Mobin Steel Logo">
            </div>
            <nav class="nav-menu" data-key="header.nav">
                <a href="#" class="active" data-key="nav.home">Home</a>
                <a href="#" data-key="nav.products">Products</a>
                <a href="#" data-key="nav.about">About Us</a>
                <a href="#" data-key="nav.contact">Contact</a>
            </nav>
            <div class="header-actions" data-key="header.actions">
                <i class="fa-solid fa-magnifying-glass" data-key="icon.search"></i>
                <i class="fa-solid fa-cart-shopping" data-key="icon.cart"></i>
                <button class="order-btn" data-key="button.order">Order Now <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </header>

        <section class="hero" data-key="hero">
            <div class="hero-content" data-key="hero.content">
                <p class="subtitle" data-key="hero.subtitle">PREMIUM FOOD &amp; BEVERAGE PRODUCTS</p>
                <h1 data-key="hero.title">Natural Taste,<br>Better Life</h1>
                <p class="description" data-key="hero.description">High quality food, beverages and essential products for a healthier and happier life.</p>
                <button class="explore-btn" data-key="button.explore">Explore Products <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </section>

        <div class="bottom-section" data-key="bottom.section">
            <div class="features-list" data-key="features.list">
                <div class="feature" data-key="feature.quality"><i class="fa-solid fa-shield-halved"></i><div class="feature-text"><h4 data-key="feature.quality.title">Premium Quality</h4><p data-key="feature.quality.text">Trusted by Families</p></div></div>
                <div class="feature" data-key="feature.delivery"><i class="fa-solid fa-truck-fast"></i><div class="feature-text"><h4 data-key="feature.delivery.title">Fast Delivery</h4><p data-key="feature.delivery.text">Across the Country</p></div></div>
                <div class="feature" data-key="feature.fresh"><i class="fa-solid fa-leaf"></i><div class="feature-text"><h4 data-key="feature.fresh.title">Natural &amp; Fresh</h4><p data-key="feature.fresh.text">Pure Goodness</p></div></div>
            </div>
            <div class="slider-dots" data-key="slider.dots">
                <div class="dot active" data-slide="1"></div>
                <div class="dot" data-slide="2"></div>
                <div class="dot" data-slide="3"></div>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="site-content.js"></script>
    <script src="script.js"></script>
</body>
</html>
