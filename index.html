<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohajer Mobin Steel - Landing Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="https://res.cloudinary.com/dqhbyqftq/image/upload/v1789556584/%D9%84%D9%88%DA%AF%D9%88_1_ets73u.png" alt="Mohajer Mobin Steel Logo">
            </div>
            <nav class="nav-menu">
                <a href="#" class="active">Home</a>
                <a href="#">Products</a>
                <a href="#">About Us</a>
                <a href="#">Contact</a>
            </nav>
            <div class="header-actions">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-cart-shopping"></i>
                <button class="order-btn">Order Now <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </header>
        <section class="hero">
            <div class="hero-content">
                <p class="subtitle">PREMIUM FOOD &amp; BEVERAGE PRODUCTS</p>
                <h1>Natural Taste,<br>Better Life</h1>
                <p class="description">High quality food, beverages and essential products for a healthier and happier life.</p>
                <button class="explore-btn">Explore Products <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </section>
        <div class="bottom-section">
            <div class="features-list">
                <div class="feature"><i class="fa-solid fa-shield-halved"></i><div class="feature-text"><h4>Premium Quality</h4><p>Trusted by Families</p></div></div>
                <div class="feature"><i class="fa-solid fa-truck-fast"></i><div class="feature-text"><h4>Fast Delivery</h4><p>Across the Country</p></div></div>
                <div class="feature"><i class="fa-solid fa-leaf"></i><div class="feature-text"><h4>Natural &amp; Fresh</h4><p>Pure Goodness</p></div></div>
            </div>
            <div class="slider-dots">
                <div class="dot active" data-slide="1"></div>
                <div class="dot" data-slide="2"></div>
                <div class="dot" data-slide="3"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
